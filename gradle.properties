# ============================================================
#  04-NeoForge-1.21.1  -  [More_Balls] for Minecraft 1.21.1 / NeoForge
#
#  Ported from the 26.2 line (07-NeoForge-26.2, mod_version 1.1.3.34).
#  This line has its own version sequence starting at 1.0.0.0.
#
#  NOTE: this file is intentionally ASCII-only. Gradle decodes .properties
#  as ISO-8859-1 and Windows PowerShell rewrites them as GBK, which burns
#  any raw CJK comment into mojibake. Edit it with an editor, never with
#  Get-Content/Set-Content.
# ============================================================

# ---------- Version assignment ----------
mc_version=1.21.1
loader=NeoForge
loader_version=21.1.255
# This is the javafml (FML language loader) range, written into mods.toml
# as loaderVersion. It is NOT the NeoForge version.
loader_version_range=[4,)

# ---------- Build toolchain ----------
# IMPORTANT: ASCII paths only. Builds must run through the ASCII mirror
# C:\mcbuild (a directory symlink pointing at this workspace).
use_ascii_mirror=true
mirror_root=C:/mcbuild
java_version=21
jdk_root=C:/mcbuild/.shared/tools/jdk

# Shared source root: single source of truth for code shared by all version lines
mirror_shared_subpath=.shared/shared-code

# ---------- Mappings ----------
# 1.21.1 Parchment is published, but the workspace keeps it off for
# reproducible offline builds; official mappings are used instead.
use_parchment=false
parchment_minecraft=1.21.1
parchment_version=2024.11.17

# ---------- Mod metadata (expanded into mods.toml by processResources) ----------
# Keep this ASCII: the values are injected into mods.toml and read back by
# the game, so non-ASCII text here would reach the player as mojibake.
mod_id=more_balls
# CJK display name uses \uXXXX escapes: Gradle decodes properties as
# ISO-8859-1, so raw CJK would already be mojibake before injection.
mod_name=[\u66f4\u591a\u7403] More_Balls
# jar output name (file names may carry CJK and brackets; mod_id may not)
mod_jar_basename=[\u66f4\u591a\u7403] More_Balls
mod_license=All Rights Reserved
mod_version=1.0.0.1
mod_group_id=com.mcmodworkspace.moreballs
mod_authors=
mod_description=Adds many throwable ball items, heat mechanics, pouches and crossbow ammo to Minecraft

# ---------- Performance ----------
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -Dfile.encoding=UTF-8

# ---------- Compatibility dependency versions (JEI / AppleSkin / Curios) ----------
jei_version=19.57.0.451
appleskin_version=3.0.9+mc1.21
# Compatibility verification jar cache (AppleSkin has no maven coordinates)
compat_jars=C:/mcbuild/.shared/compat-jars
